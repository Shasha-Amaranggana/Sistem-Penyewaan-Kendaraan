<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        KeSanaSini
        {% endblock %}
    </title>


    <!-- CSS GLOBAL -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">


    <!-- FONT AWESOME -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- CSS KHUSUS HALAMAN -->

    {% block css %}
    {% endblock %}

</head>


<body class="user-page">


    <!-- NAVBAR -->

    <header class="navbar">

        <a href="{{ url_for('main.index') }}"
           class="navbar-logo">

            <img
                src="{{ url_for('static', filename='images/logo-navbar.png') }}"
                alt="KeSanaSini"
            >

        </a>


        <nav class="nav-menu">

            <a href="{{ url_for('main.index') }}"
               class="nav-link active">

                Menu Utama

            </a>

            <a href="#"
               class="nav-link">

                Pesanan Saya

            </a>

            <a href="#"
               class="nav-link">

                Riwayat Pesanan

            </a>

        </nav>


        {% if user %}

        <div class="user-menu">

            <div class="user-icon">

                <i class="fa-regular fa-user"></i>

            </div>


            <span class="user-email">

                {{ user.email }}

            </span>


            <i class="fa-solid fa-chevron-down user-arrow"></i>


            <div class="user-dropdown">

                <a href="#">

                    <i class="fa-regular fa-user"></i>

                    Profil

                </a>


                <a href="{{ url_for('main.logout') }}">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Keluar

                </a>

            </div>

        </div>

        {% endif %}

    </header>


    <!-- ISI HALAMAN -->

    {% block content %}
    {% endblock %}


    <!-- FOOTER -->

    <footer class="footer">

    </footer>


    <!-- JAVASCRIPT GLOBAL -->

    <script>

        const userMenu =
            document.querySelector('.user-menu');


        if (userMenu) {

            userMenu.addEventListener(
                'click',
                function () {

                    this.classList.toggle('open');

                }
            );

        }

    </script>

</body>

</html>
