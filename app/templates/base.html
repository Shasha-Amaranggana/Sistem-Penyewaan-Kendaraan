<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Sini - Penyewaan Kendaraan</title>
    <!-- Font dari Figma -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Work+Sans:wght@500&display=swap" rel="stylesheet">
    <!-- FontAwesome untuk Ikon Profesional (Pengganti Emoji) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Sana Sini Logo" class="brand-logo">
        </div>
        
        {% if session.get('user_id') %}
        <nav class="nav-links">
            <a href="/" class="active">Menu utama</a>
            <a href="#">Kelola akun</a>
        </nav>
        {% endif %}
        
        <div class="contact-info">
            <span>0912345678</span>
            <span>sanasini@gmail.com</span>
            {% if not session.get('user_id') %}
            <div class="social-circles">
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
            </div>
            {% endif %}
        </div>
    </header>

    <main>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div style="background: red; color: white; padding: 10px; border-radius: 5px; margin: 20px auto; text-align: center; width: 100%; max-width: 400px;">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
